name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The daily secp256k1 bump runs these jobs on its branch before merging it.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-24.04
    # Debian trixie ships GCC 14 and clang 19, the versions Guix builds releases with.
    container: debian:trixie
    steps:
      - name: Install toolchain
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          git ca-certificates make libc6-dev gcc-14 clang-19 libclang-rt-19-dev python3
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - name: Selftest, corpus replay and short run of every target
        run: make -j"$(nproc)" check GCC=gcc-14 CLANG=clang-19

  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - name: Selftest and corpus replay on every architecture
        run: make -j"$(nproc)" docker-cross
