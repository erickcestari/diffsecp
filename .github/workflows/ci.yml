name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install clang with libFuzzer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-rt-dev
      - name: Selftest, corpus replay and short run of every target
        run: make -j"$(nproc)" check

  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Replay the corpus on every architecture
        run: make -j"$(nproc)" docker-cross
