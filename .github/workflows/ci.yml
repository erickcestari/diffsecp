name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The daily secp256k1 bump runs these jobs on its branch before merging it.
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

jobs:
  check:
    # Natively on aarch64 too, where every variant builds for arm64.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Debian trixie ships GCC 14 and clang 19, the versions Guix builds releases with.
    container: debian:trixie
    steps:
      - name: Install toolchain
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          git ca-certificates make libc6-dev gcc-14 clang-19 libclang-rt-19-dev
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - name: Selftest, corpus replay and short run of every target
        run: make -j"$(nproc)" check GCC=gcc-14 CLANG=clang-19

  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - name: Selftest and corpus replay on every architecture
        run: make -j"$(nproc)" docker-cross
      # The reference the macos job compares against.
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-digests
          path: build/docker/cross/x86_64/digests

  # macOS has no user-mode emulator, so a real arm64 Mac replays the corpus.
  macos:
    needs: cross
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-digests
          path: build/reference
      # macOS ships GNU make 3.81; Homebrew's current one installs as gmake.
      - name: Install GNU make
        run: brew install make
      - name: Compiler version
        run: xcrun clang --version | head -n 1
      - name: Corpus replay on macOS
        run: gmake -j"$(sysctl -n hw.ncpu)" native CROSS_REF=build/reference/digests
