name: Fuzz

# Fuzzes every target from the corpus on one runner, then adds the inputs that
# raise coverage to the corpus and refreshes the README's coverage table once CI
# passes on them. The full coverage report is uploaded as an artifact.
# A divergence fails the run without printing it and uploads its reproducer
# encrypted to the maintainer's key (ci/seal-reproducers.sh). Daily, finishing
# before the secp256k1 bump so the two never race to fast-forward master.
on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz every target for
        default: '120'

permissions:
  contents: write

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    # The compilers and LLVM tools CI builds with; make reads them from the environment.
    container: debian:trixie
    env:
      GCC: gcc-14
      CLANG: clang-19
      LLVM_PROFDATA: llvm-profdata-19
      LLVM_COV: llvm-cov-19
    outputs:
      changed: ${{ steps.corpus.outputs.changed }}
    steps:
      - name: Install toolchain
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          git ca-certificates make libc6-dev gcc-14 clang-19 libclang-rt-19-dev llvm-19 gnupg
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Build
        run: make -j"$(nproc)" all
      - name: Fuzz every target at once
        env:
          MINUTES: ${{ inputs.minutes || '120' }}
        # A failure's output names the input, so it stays out of the public log.
        run: |
          if ! make -k -j fuzz FUZZ_TIME=$((60 * MINUTES)) > build/fuzz.out 2>&1; then
            echo "::error::fuzzing failed; its output is in the encrypted reproducers artifact"
            exit 1
          fi
          cat build/fuzz.out
      - name: Encrypt the reproducers
        if: failure()
        run: ci/seal-reproducers.sh build/reproducers.tar.gz.gpg build/crashes build/fuzz-*.log build/fuzz.out
      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproducers
          path: build/reproducers.tar.gz.gpg
      # Skipped after a failure: inputs found near a divergence could point at it.
      - name: Keep the new inputs that raise coverage
        run: make -j"$(nproc)" merge
      - name: Refresh the README's coverage table
        run: make readme-coverage
      - name: Commit to the fuzz-corpus branch
        id: corpus
        run: |
          # checkout trusts the runner-owned workspace only while it runs; the container is root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add corpus README.md
          if git diff --cached --quiet; then
            echo changed=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --quiet -- corpus; then
            subject="readme: refresh coverage"
          else
            subject="corpus: add inputs from daily fuzzing"
          fi
          git config user.name 'diffsecp CI'
          git config user.email 'ci@diffsecp.invalid'
          git commit -q -m "$subject" -m "$(git diff --cached --stat HEAD | tail -n 1)"
          git push -f origin HEAD:refs/heads/fuzz-corpus
          echo changed=true >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage/html
            build/coverage/report.txt

  ci:
    needs: fuzz
    if: ${{ !cancelled() && needs.fuzz.outputs.changed == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: fuzz-corpus

  merge:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fast-forward master to the update
        run: |
          git fetch origin fuzz-corpus
          git merge --ff-only FETCH_HEAD
          git push origin HEAD:master :fuzz-corpus
