name: Latest compilers

# Builds every variant with the newest GCC and clang, which distros ship long
# before Guix moves to them and where new optimizer bugs show up first, then
# replays the corpus and fuzzes every target. Arch Linux packages each compiler
# release within weeks. Weekly, and it never touches the corpus. Failures are
# kept out of the public log and uploaded encrypted, as in fuzz.yml.
on:
  schedule:
    - cron: '7 9 * * 0'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz every target for
        default: '120'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed base-devel clang compiler-rt git gnupg
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Compiler versions
        run: gcc --version | head -n 1 && clang --version | head -n 1
      # A failure's output names the input, so it stays out of the public log.
      - name: Selftest, corpus replay and short run of every target
        run: |
          mkdir -p build
          if ! make -j"$(nproc)" check > build/check.out 2>&1; then
            echo "::error::make check failed; its output is in the encrypted reproducers artifact"
            exit 1
          fi
          cat build/check.out
      - name: Fuzz every target at once
        env:
          MINUTES: ${{ inputs.minutes || '120' }}
        run: |
          if ! make -k -j fuzz FUZZ_TIME=$((60 * MINUTES)) > build/fuzz.out 2>&1; then
            echo "::error::fuzzing failed; its output is in the encrypted reproducers artifact"
            exit 1
          fi
          cat build/fuzz.out
      # make check leaves its crash files in the working directory.
      - name: Encrypt the reproducers
        if: failure()
        run: ci/seal-reproducers.sh build/reproducers.tar.gz.gpg crash-* build/crashes build/*.log build/*.out
      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproducers
          path: build/reproducers.tar.gz.gpg
