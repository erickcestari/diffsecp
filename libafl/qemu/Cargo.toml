[package]
name = "diffsecp_qemu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# The guest architecture; exactly one, as libafl_qemu builds QEMU for it.
arm = ["libafl_qemu/arm"]
aarch64 = ["libafl_qemu/aarch64"]
riscv64 = ["libafl_qemu/riscv64"]

[dependencies]
libafl.workspace = true
libafl_bolts.workspace = true
libafl_qemu = { workspace = true, features = ["usermode"] }
libafl_targets.workspace = true
clap.workspace = true
serde.workspace = true
common.workspace = true
