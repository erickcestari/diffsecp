[workspace]
members = ["common", "inprocess", "qemu"]
# qemu builds QEMU for one architecture feature, so plain `cargo build` skips it.
default-members = ["common", "inprocess"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
libafl = "=0.16.1"
libafl_bolts = "=0.16.1"
libafl_targets = "=0.16.1"
libafl_qemu = { version = "=0.16.1", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
common = { path = "common", package = "diffsecp_common" }

[profile.release]
debug = true
